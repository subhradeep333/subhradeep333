<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 840 48" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');

      .font-ui {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      /* Online Status Green Dot Pulse */
      .status-pulse {
        animation: pulseOnline 3s ease-in-out infinite;
      }
      @keyframes pulseOnline {
        0%, 100% { opacity: 0.65; transform: scale(0.95); }
        50% { opacity: 1.0; transform: scale(1.15); }
      }

      /* Ambient Glint Sheen across Preview Pill (6.0s loop) */
      .glint-sheen {
        animation: previewSheen 6s ease-in-out infinite;
      }
      @keyframes previewSheen {
        0%, 75% {
          transform: translateX(-100px) skewX(-25deg);
          opacity: 0;
        }
        80% {
          opacity: 0.55;
        }
        90% {
          opacity: 0.55;
        }
        96%, 100% {
          transform: translateX(120px) skewX(-25deg);
          opacity: 0;
        }
      }

      .btn-preview {
        cursor: pointer;
      }
    </style>

    <!-- Clip Path for Preview Pill Sheen -->
    <clipPath id="pill-sheen-clip">
      <rect x="668" y="11" width="76" height="26" rx="13" />
    </clipPath>

    <!-- Pill Sheen Gradient -->
    <linearGradient id="sheen-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- GitHub Canvas Background -->
  <rect width="840" height="48" fill="#0d1117" />

  <!-- Window Header Bar Container -->
  <rect x="12" y="4" width="816" height="40" rx="10" fill="#12161c" stroke="#24292f" stroke-width="1" />

  <!-- LEFT CLUSTER: Traffic Lights, Octocat, Avatar, Breadcrumb -->
  <g transform="translate(12, 4)">
    <!-- macOS Traffic Lights (Red, Yellow, Green) -->
    <circle cx="20" cy="20" r="5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
    <circle cx="34" cy="20" r="5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
    <circle cx="48" cy="20" r="5" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />

    <!-- GitHub Octocat Silhouette Icon (18px x 18px at x=64, y=11) -->
    <g transform="translate(64, 11) scale(1.125)" fill="#e6edf3">
      <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z" />
    </g>

    <!-- Circular Avatar (22px x 22px at cx=100, cy=20) -->
    <defs>
      <clipPath id="avatar-hdr-clip">
        <circle cx="100" cy="20" r="11" />
      </clipPath>
    </defs>
    <image x="89" y="9" width="22" height="22" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatar-hdr-clip)" href="data:image/jpeg;base64," xlink:href="data:image/jpeg;base64," />
    <circle cx="100" cy="20" r="11" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />

    <!-- Green Online Status Dot (6px at cx=108, cy=28) -->
    <g transform="translate(108, 28)" class="status-pulse">
      <circle cx="0" cy="0" r="3.2" fill="#27c93f" stroke="#12161c" stroke-width="1" />
    </g>

    <!-- Breadcrumb: subhradeep333 / README.md -->
    <text x="122" y="24" class="font-ui" font-size="13" font-weight="500" letter-spacing="-0.01em">
      <tspan fill="#c9d1d9">subhradeep333</tspan>
      <tspan fill="#6e7681"> / </tspan>
      <tspan fill="#e6edf3" font-weight="600">README.md</tspan>
    </text>
  </g>

  <!-- RIGHT CLUSTER: Active Preview Pill, Inactive Code Tab, Overflow Dots -->
  <g>
    <!-- Active Preview Pill (Width: 76px, Height: 26px at x=670, y=11) -->
    <g class="btn-preview">
      <rect x="670" y="11" width="76" height="26" rx="13" fill="#1e242b" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <text x="708" y="27.5" text-anchor="middle" class="font-ui" font-size="12.5" font-weight="500" fill="#f0f6fc">Preview</text>
      <!-- Subtle Sheen Glide -->
      <g clip-path="url(#pill-sheen-clip)">
        <rect x="670" y="11" width="40" height="26" fill="url(#sheen-grad)" class="glint-sheen" />
      </g>
    </g>

    <!-- Inactive Code Tab -->
    <text x="770" y="27.5" text-anchor="middle" class="font-ui" font-size="12.5" font-weight="500" fill="#8b949e">Code</text>

    <!-- Overflow Menu Dots -->
    <circle cx="802" cy="24" r="1.6" fill="#8b949e" />
    <circle cx="808" cy="24" r="1.6" fill="#8b949e" />
    <circle cx="814" cy="24" r="1.6" fill="#8b949e" />
  </g>
</svg>
