<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 195" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');

      .font-mono {
        font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', ui-monospace, monospace;
        font-variant-ligatures: none;
        white-space: pre;
      }

      .ascii-line {
        font-size: 13.5px;
        font-weight: 700;
        fill: #e6edf3;
        letter-spacing: 0.01em;
      }

      /* Titlebar Command Typing Animation (0.0s - 1.0s, pause till 1.1s) */
      .cmd-reveal {
        animation: typeCommand 7.5s steps(18, end) infinite;
      }
      @keyframes typeCommand {
        0% { width: 0px; }
        13.3% /* 1.0s */ { width: 175px; }
        88% /* 6.6s */ { width: 175px; opacity: 1; }
        96% /* 7.2s */ { width: 175px; opacity: 0; }
        100% { width: 0px; opacity: 0; }
      }

      /* Titlebar Command Leading Bar Cursor */
      .cmd-cursor {
        animation: cmdCursorMove 7.5s steps(18, end) infinite;
      }
      @keyframes cmdCursorMove {
        0% { transform: translateX(0px); opacity: 1; }
        13.3% /* 1.0s */ { transform: translateX(175px); opacity: 1; }
        14.7% /* 1.1s */ { transform: translateX(175px); opacity: 0; }
        88% { transform: translateX(175px); opacity: 0; }
        96% { transform: translateX(0px); opacity: 0; }
        100% { transform: translateX(0px); opacity: 1; }
      }

      /* ASCII Typing Wipe Mask (1.1s - 3.8s typing, 3.8s - 6.6s hold, 6.6s - 7.5s clear) */
      .ascii-type-wipe {
        animation: typeAsciiWipe 7.5s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
      }
      @keyframes typeAsciiWipe {
        0%, 14.6% /* 1.1s */ {
          width: 0px;
          opacity: 1;
        }
        50.6% /* 3.8s */ {
          width: 760px;
          opacity: 1;
        }
        88.0% /* 6.6s */ {
          width: 760px;
          opacity: 1;
        }
        98.6% /* 7.4s */ {
          width: 760px;
          opacity: 0;
        }
        100% {
          width: 0px;
          opacity: 0;
        }
      }

      /* Cyan Glowing Block Cursor riding the typing front (1.1s - 3.8s) */
      .ascii-typing-cursor {
        animation: asciiCursorRide 7.5s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
      }
      @keyframes asciiCursorRide {
        0%, 14.6% /* 1.1s */ {
          transform: translateX(45px);
          opacity: 0;
        }
        15.5% {
          opacity: 1;
        }
        50.0% /* 3.75s */ {
          opacity: 1;
        }
        50.6% /* 3.8s */ {
          transform: translateX(785px);
          opacity: 0;
        }
        100% {
          transform: translateX(785px);
          opacity: 0;
        }
      }

      /* Idle Blinking Block Cursor during Hold (3.8s - 6.6s) */
      .ascii-idle-cursor {
        animation: idleCursorBlink 7.5s step-end infinite;
      }
      @keyframes idleCursorBlink {
        0%, 50.6% /* 3.8s */ { opacity: 0; }
        54% { opacity: 1; }
        60% { opacity: 0; }
        66% { opacity: 1; }
        72% { opacity: 0; }
        78% { opacity: 1; }
        84% { opacity: 0; }
        88% /* 6.6s */ { opacity: 0; }
        100% { opacity: 0; }
      }

      /* Phase 3 Kinetic Sine-Wave Float and Shimmer (3.8s - 6.6s) */
      .ascii-float-group {
        animation: floatSineWave 7.5s ease-in-out infinite;
      }
      @keyframes floatSineWave {
        0%, 50.6% /* 3.8s */ {
          transform: translateY(0px);
        }
        60% {
          transform: translateY(-2.5px);
        }
        72% {
          transform: translateY(2.0px);
        }
        84% {
          transform: translateY(-1.0px);
        }
        88.0% /* 6.6s */ {
          transform: translateY(0px);
        }
        100% {
          transform: translateY(0px);
        }
      }

      /* Phase 3 Diagonal Luminance Shimmer Sweep (4.2s - 5.6s) */
      .ascii-shimmer-sweep {
        animation: textShimmer 7.5s ease-in-out infinite;
      }
      @keyframes textShimmer {
        0%, 54% /* 4.05s */ {
          transform: translateX(-400px) skewX(-20deg);
          opacity: 0;
        }
        58% {
          opacity: 0.7;
        }
        68% {
          opacity: 0.7;
        }
        74% /* 5.55s */ {
          transform: translateX(750px) skewX(-20deg);
          opacity: 0;
        }
        100% {
          transform: translateX(750px) skewX(-20deg);
          opacity: 0;
        }
      }
    </style>

    <!-- Filters -->
    <filter id="cursor-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Clip Paths -->
    <clipPath id="term-window-clip">
      <rect x="12" y="10" width="816" height="175" rx="10" />
    </clipPath>

    <clipPath id="cmd-text-clip">
      <rect x="395" y="15" width="0" height="20" class="cmd-reveal" />
    </clipPath>

    <clipPath id="viewport-text-clip">
      <rect x="16" y="42" width="808" height="138" />
    </clipPath>

    <!-- Mask for Live ASCII Typing Wavefront -->
    <mask id="ascii-typing-mask" maskUnits="userSpaceOnUse">
      <rect x="35" y="45" width="0" height="135" fill="#ffffff" class="ascii-type-wipe" />
    </mask>

    <!-- Shimmer Highlight Gradient -->
    <linearGradient id="ascii-sheen-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Scanlines for Terminal Texture -->
    <pattern id="term-scanlines" width="100%" height="3" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="840" y2="0" stroke="#000000" stroke-width="1" opacity="0.2" />
    </pattern>
  </defs>

  <!-- GitHub Outer Canvas -->
  <rect width="840" height="195" fill="#0d1117" />

  <!-- ==================== MACOS TERMINAL WINDOW ==================== -->
  <g>
    <!-- Window Body -->
    <rect x="12" y="10" width="816" height="175" rx="10" fill="#0b0f17" stroke="#1f2736" stroke-width="1.2" />

    <!-- Titlebar (Clipped to Window Rounded Corners) -->
    <g clip-path="url(#term-window-clip)">
      <rect x="12" y="10" width="816" height="30" fill="#161b26" />
      <line x1="12" y1="40" x2="828" y2="40" stroke="#1f2736" stroke-width="1" />

      <!-- Traffic-Light Controls -->
      <circle cx="28" cy="25" r="5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
      <circle cx="44" cy="25" r="5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
      <circle cx="60" cy="25" r="5" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />

      <!-- Static Shell Prefix (subhradeep333@github: ~$ ) -->
      <g transform="translate(195, 29)">
        <text x="0" y="0" class="font-mono" font-size="11" font-weight="500" fill="#8b949e">subhradeep333@github: ~$ </text>
        <!-- Typing Command: ./wordmark.sh -->
        <g clip-path="url(#cmd-text-clip)">
          <text x="200" y="0" class="font-mono" font-size="11" font-weight="500" fill="#e6edf3">./wordmark.sh --name</text>
        </g>
        <!-- Leading Cursor for Command -->
        <g transform="translate(200, -9)" class="cmd-cursor">
          <rect x="0" y="0" width="6" height="11" fill="#58a6ff" />
        </g>
      </g>
    </g>

    <!-- Terminal Viewport Surface Texture -->
    <g clip-path="url(#term-window-clip)">
      <rect x="12" y="41" width="816" height="144" fill="url(#term-scanlines)" pointer-events="none" />
    </g>

    <!-- ==================== ASCII WORDMARK (SUBHRADEEP) ==================== -->
    <g clip-path="url(#viewport-text-clip)" class="ascii-float-group">
      <!-- Live Typing Masked ASCII Text -->
      <g mask="url(#ascii-typing-mask)">
        <text x="420" y="78.0" text-anchor="middle" class="font-mono ascii-line">███████╗ ██╗   ██╗ ██████╗  ██╗  ██╗ ██████╗   █████╗  ██████╗  ███████╗ ███████╗ ██████╗ </text>
    <text x="420" y="95.5" text-anchor="middle" class="font-mono ascii-line">██╔════╝ ██║   ██║ ██╔══██╗ ██║  ██║ ██╔══██╗ ██╔══██╗ ██╔══██╗ ██╔════╝ ██╔════╝ ██╔══██╗</text>
    <text x="420" y="113.0" text-anchor="middle" class="font-mono ascii-line">███████╗ ██║   ██║ ██████╔╝ ███████║ ██████╔╝ ███████║ ██║  ██║ █████╗   █████╗   ██████╔╝</text>
    <text x="420" y="130.5" text-anchor="middle" class="font-mono ascii-line">╚════██║ ██║   ██║ ██╔══██╗ ██╔══██║ ██╔══██╗ ██╔══██║ ██║  ██║ ██╔══╝   ██╔══╝   ██╔═══╝ </text>
    <text x="420" y="148.0" text-anchor="middle" class="font-mono ascii-line">███████║ ╚██████╔╝ ██████╔╝ ██║  ██║ ██║  ██║ ██║  ██║ ██████╔╝ ███████╗ ███████╗ ██║     </text>
    <text x="420" y="165.5" text-anchor="middle" class="font-mono ascii-line">╚══════╝  ╚═════╝  ╚═════╝  ╚═╝  ╚═╝ ╚═╝  ╚═╝ ╚═╝  ╚═╝ ╚═════╝  ╚══════╝ ╚══════╝ ╚═╝     </text>
      </g>

      <!-- Active Typing Cyan Block Cursor (Traveling 1.1s - 3.8s) -->
      <g class="ascii-typing-cursor">
        <rect x="0" y="65" width="8" height="105" rx="2" fill="#58a6ff" filter="url(#cursor-glow)" opacity="0.85" />
        <rect x="1" y="65" width="6" height="105" rx="1" fill="#ffffff" opacity="0.95" />
      </g>

      <!-- Idle Blinking Cursor during Hold (3.8s - 6.6s at bottom-right of text) -->
      <rect x="788" y="156" width="9" height="15" rx="1" fill="#58a6ff" filter="url(#cursor-glow)" class="ascii-idle-cursor" />

      <!-- Diagonal Luminance Shimmer Highlight (Sweeping during Hold) -->
      <g mask="url(#ascii-typing-mask)">
        <rect x="100" y="45" width="140" height="135" fill="url(#ascii-sheen-grad)" class="ascii-shimmer-sweep" />
      </g>
    </g>

    <!-- Bottom-Right Watermark -->
  </g>
</svg>