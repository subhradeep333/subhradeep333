<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 390" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');

      .bg-card { fill: #070b14; stroke: #1d2842; stroke-width: 1.5; rx: 16px; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', ui-monospace, monospace; }
      
      /* Orbital ring continuous rotation */
      .spin-cw {
        transform-box: fill-box;
        transform-origin: center;
        animation: rotateCW 6s linear infinite;
      }
      .spin-ccw {
        transform-box: fill-box;
        transform-origin: center;
        animation: rotateCCW 6s linear infinite;
      }

      @keyframes rotateCW {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes rotateCCW {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }

      /* Constellation Signal Path Marching Ants */
      .pulse-path {
        stroke-dasharray: 4, 8;
        animation: pulseFlow 6s linear infinite;
      }
      @keyframes pulseFlow {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -72; }
      }

      /* Halo breathing animation */
      .halo-java {
        animation: breatheJava 6s ease-in-out infinite;
      }
      .halo-java-delay {
        animation: breatheJava 6s ease-in-out 1.5s infinite;
      }
      .halo-html {
        animation: breatheHtml 6s ease-in-out 3s infinite;
      }
      .halo-js {
        animation: breatheJs 6s ease-in-out 4.5s infinite;
      }

      @keyframes breatheJava {
        0%, 100% { opacity: 0.18; transform: scale(1); }
        50% { opacity: 0.32; transform: scale(1.06); }
      }
      @keyframes breatheHtml {
        0%, 100% { opacity: 0.20; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(1.07); }
      }
      @keyframes breatheJs {
        0%, 100% { opacity: 0.18; transform: scale(1); }
        50% { opacity: 0.33; transform: scale(1.06); }
      }

      .halo-node {
        transform-box: fill-box;
        transform-origin: center;
      }
    </style>

    <!-- Radial Glow Gradients -->
    <radialGradient id="glow-hero" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d9822b" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#d9822b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#d9822b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-java" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d9822b" stop-opacity="0.40" />
      <stop offset="60%" stop-color="#d9822b" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#d9822b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-html" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e34c26" stop-opacity="0.42" />
      <stop offset="60%" stop-color="#e34c26" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#e34c26" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-js" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f1e05a" stop-opacity="0.40" />
      <stop offset="60%" stop-color="#f1e05a" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#f1e05a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Card Surface -->
  <rect width="840" height="390" class="bg-card" />

  <!-- Ambient Astronomical Grid / Orbit Guides -->
  <g opacity="0.15">
    <circle cx="380" cy="205" r="145" fill="none" stroke="#2b3a55" stroke-width="1" stroke-dasharray="3, 8" />
    <circle cx="380" cy="205" r="265" fill="none" stroke="#2b3a55" stroke-width="1" stroke-dasharray="2, 10" />
    <!-- Telemetry Crosshairs -->
    <path d="M 60 110 L 70 110 M 65 105 L 65 115" stroke="#5b73a3" stroke-width="1" />
    <path d="M 770 110 L 780 110 M 775 105 L 775 115" stroke="#5b73a3" stroke-width="1" />
    <path d="M 60 320 L 70 320 M 65 315 L 65 325" stroke="#5b73a3" stroke-width="1" />
    <path d="M 770 320 L 780 320 M 775 315 L 775 325" stroke="#5b73a3" stroke-width="1" />
  </g>

  <!-- Header Block -->
  <g>
    <text x="32" y="38" class="mono" font-size="11" font-weight="500" letter-spacing="0.16em" fill="#8b9ec2">PROJECT CONSTELLATION</text>
    <text x="32" y="66" class="mono" font-size="22" font-weight="600" letter-spacing="-0.01em" fill="#f1f5f9">A universe of work</text>
    <!-- Dashed Divider -->
    <line x1="32" y1="84" x2="808" y2="84" stroke="#1e2b45" stroke-width="1" stroke-dasharray="6, 12" />
  </g>

  <!-- Constellation Curved Paths (Hero: 380, 205) -->
  <g>
    <!-- Path to Node 02 (150, 205) -->
    <path d="M 380 205 Q 265 170 150 205" fill="none" stroke="#5b73a3" stroke-width="1.5" class="pulse-path" opacity="0.5" />
    <!-- Path to Node 03 (660, 150) -->
    <path d="M 380 205 Q 520 135 660 150" fill="none" stroke="#5b73a3" stroke-width="1.5" class="pulse-path" opacity="0.5" />
    <!-- Path to Node 04 (600, 290) -->
    <path d="M 380 205 Q 490 280 600 290" fill="none" stroke="#5b73a3" stroke-width="1.5" class="pulse-path" opacity="0.5" />
    <!-- Inter-satellite Auxiliary Arc -->
    <path d="M 660 150 Q 685 220 600 290" fill="none" stroke="#2b3a55" stroke-width="1" stroke-dasharray="2, 6" opacity="0.35" />
  </g>

  <!-- ==================== NODE 01: HERO (Java) ==================== -->
  <g>
    <!-- Halo Radial Glow -->
    <circle cx="380" cy="205" r="50" fill="url(#glow-hero)" class="halo-node halo-java" />
    
    <!-- Rotating Dashed Orbital Ring (CW) -->
    <g class="spin-cw">
      <circle cx="380" cy="205" r="44" fill="none" stroke="rgba(217, 130, 43, 0.55)" stroke-width="1.5" stroke-dasharray="5, 6" />
    </g>

    <!-- Core Circle -->
    <circle cx="380" cy="205" r="32" fill="#0d1424" stroke="#d9822b" stroke-width="2" />
    
    <!-- Center Icon: Stylized Java Coffee Cup / Glyph -->
    <g transform="translate(367, 192)">
      <path d="M4 17C9 17 17 17 20 17C21.5 17 22.5 16 22 14.5L20 8H4L2 14.5C1.5 16 2.5 17 4 17Z" fill="none" stroke="#d9822b" stroke-width="1.8" stroke-linejoin="round" />
      <path d="M20 10H23C24.5 10 25.5 11 25 12.5C24.5 14 23.5 15 21.5 15H20" fill="none" stroke="#d9822b" stroke-width="1.8" />
      <path d="M8 5C8 3 10 2 10 0" stroke="#d9822b" stroke-width="1.5" stroke-linecap="round" />
      <path d="M14 5C14 3 16 2 16 0" stroke="#d9822b" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Labels -->
    <text x="380" y="270" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#f1f5f9">Zero-to-Hero-in-Java</text>
    <text x="380" y="287" text-anchor="middle" class="mono" font-size="11" font-weight="500" fill="#d9822b">Java · ★ 9</text>
  </g>

  <!-- ==================== NODE 02: SATELLITE (Java) ==================== -->
  <g>
    <!-- Halo Radial Glow -->
    <circle cx="150" cy="205" r="36" fill="url(#glow-java)" class="halo-node halo-java-delay" />
    
    <!-- Rotating Dashed Orbital Ring (CCW) -->
    <g class="spin-ccw">
      <circle cx="150" cy="205" r="30" fill="none" stroke="rgba(217, 130, 43, 0.50)" stroke-width="1.5" stroke-dasharray="4, 5" />
    </g>

    <!-- Core Circle -->
    <circle cx="150" cy="205" r="21" fill="#0d1424" stroke="#d9822b" stroke-width="1.5" />
    
    <!-- Center Glyph: "J" -->
    <text x="150" y="212" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#d9822b">J</text>

    <!-- Labels -->
    <text x="150" y="252" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#f1f5f9">LibraryManagement...</text>
    <text x="150" y="269" text-anchor="middle" class="mono" font-size="11" font-weight="500" fill="#8b9ec2">Java · ★ 0</text>
  </g>

  <!-- ==================== NODE 03: SATELLITE (HTML) ==================== -->
  <g>
    <!-- Halo Radial Glow -->
    <circle cx="660" cy="150" r="38" fill="url(#glow-html)" class="halo-node halo-html" />
    
    <!-- Rotating Dashed Orbital Ring (CW) -->
    <g class="spin-cw">
      <circle cx="660" cy="150" r="31" fill="none" stroke="rgba(227, 76, 38, 0.55)" stroke-width="1.5" stroke-dasharray="4, 5" />
    </g>

    <!-- Core Circle -->
    <circle cx="660" cy="150" r="22" fill="#0d1424" stroke="#e34c26" stroke-width="1.5" />
    
    <!-- Center Glyph: "< >" -->
    <text x="660" y="156" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#e34c26">&lt;&gt;</text>

    <!-- Labels -->
    <text x="660" y="198" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#f1f5f9">Metasphere-2026</text>
    <text x="660" y="215" text-anchor="middle" class="mono" font-size="11" font-weight="500" fill="#e34c26">HTML · ★ 1</text>
  </g>

  <!-- ==================== NODE 04: SATELLITE (JavaScript) ==================== -->
  <g>
    <!-- Halo Radial Glow -->
    <circle cx="600" cy="290" r="38" fill="url(#glow-js)" class="halo-node halo-js" />
    
    <!-- Rotating Dashed Orbital Ring (CCW) -->
    <g class="spin-ccw">
      <circle cx="600" cy="290" r="31" fill="none" stroke="rgba(241, 224, 90, 0.55)" stroke-width="1.5" stroke-dasharray="4, 5" />
    </g>

    <!-- Core Circle -->
    <circle cx="600" cy="290" r="22" fill="#0d1424" stroke="#f1e05a" stroke-width="1.5" />
    
    <!-- Center Glyph: "JS" -->
    <text x="600" y="296" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#f1e05a">JS</text>

    <!-- Labels -->
    <text x="600" y="338" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#f1f5f9">ecommerce-website</text>
    <text x="600" y="354" text-anchor="middle" class="mono" font-size="11" font-weight="500" fill="#f1e05a">JavaScript · ★ 1</text>
  </g>

  <!-- Footer Watermark -->
</svg>
