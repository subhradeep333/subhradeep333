<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 148" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap');

      .font-sans {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      }
      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }

      /* Aurora Ambient Drift */
      .aurora-orbit-1 {
        animation: drift1 8s ease-in-out infinite alternate;
        transform-box: fill-box;
        transform-origin: center;
      }
      .aurora-orbit-2 {
        animation: drift2 8s ease-in-out infinite alternate;
        transform-box: fill-box;
        transform-origin: center;
      }
      .aurora-orbit-3 {
        animation: drift3 8s ease-in-out infinite alternate;
        transform-box: fill-box;
        transform-origin: center;
      }
      .aurora-orbit-4 {
        animation: drift4 8s ease-in-out infinite alternate;
        transform-box: fill-box;
        transform-origin: center;
      }

      @keyframes drift1 {
        0% { transform: translate(-20px, -10px) scale(0.95); opacity: 0.28; }
        50% { transform: translate(25px, 15px) scale(1.12); opacity: 0.40; }
        100% { transform: translate(5px, -5px) scale(1.0); opacity: 0.32; }
      }
      @keyframes drift2 {
        0% { transform: translate(15px, 10px) scale(1.0); opacity: 0.22; }
        50% { transform: translate(-20px, -15px) scale(1.15); opacity: 0.35; }
        100% { transform: translate(-5px, 5px) scale(0.95); opacity: 0.25; }
      }
      @keyframes drift3 {
        0% { transform: translate(10px, -8px) scale(0.96); opacity: 0.20; }
        50% { transform: translate(-15px, 12px) scale(1.10); opacity: 0.32; }
        100% { transform: translate(5px, 8px) scale(1.0); opacity: 0.23; }
      }
      @keyframes drift4 {
        0% { transform: translate(-15px, 10px) scale(1.05); opacity: 0.26; }
        50% { transform: translate(20px, -10px) scale(0.92); opacity: 0.38; }
        100% { transform: translate(0px, 0px) scale(1.0); opacity: 0.28; }
      }

      /* 4-Phase Slow-Reveal Destination Cross-Fade (8.0s Loop) */
      /* Destination 1: Website / your-portfolio.dev (0.0s – 3.8s) */
      .dest-website {
        animation: revealWebsite 8s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }

      @keyframes revealWebsite {
        0% {
          opacity: 0;
          transform: translateY(8px);
        }
        12.5% /* 1.0s */ {
          opacity: 1;
          transform: translateY(0px);
        }
        42% /* 3.35s */ {
          opacity: 1;
          transform: translateY(0px);
        }
        48% /* 3.85s */ {
          opacity: 0;
          transform: translateY(-8px);
        }
        100% {
          opacity: 0;
          transform: translateY(-8px);
        }
      }

      /* Destination 2: GitHub / @subhradeep333 (3.8s – 6.8s) */
      .dest-github {
        animation: revealGithub 8s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }

      @keyframes revealGithub {
        0%, 46% /* 3.7s */ {
          opacity: 0;
          transform: translateY(8px);
        }
        54% /* 4.3s */ {
          opacity: 1;
          transform: translateY(0px);
        }
        78% /* 6.25s */ {
          opacity: 1;
          transform: translateY(0px);
        }
        86% /* 6.9s */ {
          opacity: 0;
          transform: translateY(-8px);
        }
        100% {
          opacity: 0;
          transform: translateY(-8px);
        }
      }

      /* Specular Light Trace along Capsule Rim */
      .specular-rim-trace {
        stroke-dasharray: 120 540;
        animation: rimSweep 8s linear infinite;
      }

      @keyframes rimSweep {
        0% {
          stroke-dashoffset: 660;
          opacity: 0.2;
        }
        15% {
          opacity: 0.9;
        }
        85% {
          opacity: 0.9;
        }
        100% {
          stroke-dashoffset: 0;
          opacity: 0.2;
        }
      }

      /* Pill Container breathing */
      .pill-interactive {
        cursor: pointer;
        transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .pill-interactive:hover {
        transform: scale(1.03);
      }
    </style>

    <!-- Deep Ambient Glow Filter -->
    <filter id="aurora-blur-pill" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35" />
    </filter>

    <filter id="specular-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" />
    </filter>

    <!-- Clip Paths -->
    <clipPath id="card-outer-clip">
      <rect x="12" y="10" width="816" height="128" rx="16" />
    </clipPath>

    <!-- Specular Rim Beam Gradient -->
    <linearGradient id="specular-beam-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.75" />
      <stop offset="80%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Pill Border Base Gradient -->
    <linearGradient id="pill-border-base-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(148, 163, 184, 0.4)" />
      <stop offset="50%" stop-color="rgba(56, 189, 248, 0.2)" />
      <stop offset="100%" stop-color="rgba(148, 163, 184, 0.35)" />
    </linearGradient>
  </defs>

  <!-- GitHub Canvas Background -->
  <rect width="840" height="148" fill="#0d1117" />

  <!-- ==================== OUTER FRAME ==================== -->
  <g>
    <!-- Base Dark Fill beneath Aurora -->
    <rect x="12" y="10" width="816" height="128" rx="16" fill="#090e17" stroke="#3b73a8" stroke-width="1.2" />

    <!-- Clipped 4-Tone Aurora Ambient Radial Mesh -->
    <g clip-path="url(#card-outer-clip)">
      <!-- 1. Cobalt Blue (Top-Left) -->
      <circle cx="160" cy="30" r="140" fill="#2563eb" class="aurora-orbit-1" filter="url(#aurora-blur-pill)" />
      <!-- 2. Emerald Green (Top-Right) -->
      <circle cx="680" cy="25" r="130" fill="#16a34a" class="aurora-orbit-2" filter="url(#aurora-blur-pill)" />
      <!-- 3. Teal (Bottom-Right) -->
      <circle cx="700" cy="115" r="120" fill="#14b8a6" class="aurora-orbit-3" filter="url(#aurora-blur-pill)" />
      <!-- 4. Violet (Bottom-Center) -->
      <circle cx="420" cy="125" r="130" fill="#7e22ce" class="aurora-orbit-4" filter="url(#aurora-blur-pill)" />
    </g>

    <!-- ==================== INNER GLASS STAGE ==================== -->
    <rect x="24" y="20" width="792" height="108" rx="14" fill="rgba(8, 13, 21, 0.72)" stroke="rgba(96, 150, 206, 0.35)" stroke-width="1" />
  </g>

  <!-- ==================== CENTERED LUMINOUS ACTION PILL ==================== -->
  <g class="pill-interactive">
    <!-- Resting Capsule Shell (Centered at x=420, y=74, width=220, height=52) -->
    <rect x="310" y="48" width="220" height="52" rx="26" fill="#0b1018" stroke="url(#pill-border-base-grad)" stroke-width="1.5" />

    <!-- Specular Rim Light Sweep Trace -->
    <rect x="310" y="48" width="220" height="52" rx="26" fill="none" stroke="url(#specular-beam-grad)" stroke-width="3" pathLength="660" class="specular-rim-trace" filter="url(#specular-glow)" opacity="0.6" />
    <rect x="310" y="48" width="220" height="52" rx="26" fill="none" stroke="url(#specular-beam-grad)" stroke-width="1.5" pathLength="660" class="specular-rim-trace" />

    <!-- ==================== DESTINATION 1: WEBSITE / your-portfolio.dev ==================== -->
    <g class="dest-website">
      <!-- Icon Medallion: Globe (28px x 28px circle at cx=338, cy=74) -->
      <circle cx="338" cy="74" r="14" fill="#363d4a" />
      <g transform="translate(338, 74)">
        <circle cx="0" cy="0" r="7.5" fill="none" stroke="#ffffff" stroke-width="1.3" />
        <ellipse cx="0" cy="0" rx="3.8" ry="7.5" fill="none" stroke="#ffffff" stroke-width="1.1" />
        <line x1="-7.5" y1="0" x2="7.5" y2="0" stroke="#ffffff" stroke-width="1.1" />
      </g>

      <!-- Text Stack -->
      <!-- Eyebrow: Website -->
      <text x="364" y="67" class="font-sans" font-size="11" font-weight="600" letter-spacing="0.02em" fill="#8b9ab2">Website</text>
      <!-- Domain: your-portfolio.dev -->
      <text x="364" y="85" class="font-sans" font-size="14.5" font-weight="700" letter-spacing="-0.01em" fill="#f3f6fa">your-portfolio.dev</text>
    </g>

    <!-- ==================== DESTINATION 2: GITHUB / @subhradeep333 ==================== -->
    <g class="dest-github">
      <!-- Icon Medallion: GitHub "G" (28px x 28px circle at cx=338, cy=74) -->
      <circle cx="338" cy="74" r="14" fill="#363d4a" />
      <text x="338" y="79.5" text-anchor="middle" class="font-sans" font-size="14" font-weight="700" fill="#ffffff">G</text>

      <!-- Text Stack -->
      <!-- Eyebrow: GitHub -->
      <text x="364" y="67" class="font-sans" font-size="11" font-weight="600" letter-spacing="0.02em" fill="#8b9ab2">GitHub</text>
      <!-- Handle: @subhradeep333 -->
      <text x="364" y="85" class="font-sans" font-size="14.5" font-weight="700" letter-spacing="-0.01em" fill="#f3f6fa">@subhradeep333</text>
    </g>
  </g>

  <!-- ==================== WATERMARK ==================== -->
  <text x="816" y="132" text-anchor="end" class="font-mono" font-size="10" font-weight="500" letter-spacing="0.02em" fill="#5f728c">gitskins.com</text>
</svg>
